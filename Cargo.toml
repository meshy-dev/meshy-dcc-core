# meshy-dcc-core Workspace
# Rust-powered core for the Meshy DCC ecosystem

[workspace]
members = [
    "crates/meshy-dcc-naming",
    "crates/meshy-dcc-models",
    "crates/meshy-dcc-actions",
    "crates/meshy-dcc-skills",
    "crates/meshy-dcc-skills-bench",
    "crates/meshy-dcc-protocols",
    "crates/meshy-dcc-jsonrpc",
    "crates/meshy-dcc-wire",
    "crates/meshy-dcc-job",
    "crates/meshy-dcc-skill-rest",
    "crates/meshy-dcc-gateway",
    "crates/meshy-dcc-gateway-admin",
    "crates/meshy-dcc-gateway-core",
    "crates/meshy-dcc-gateway-ensure",
    "crates/meshy-dcc-gateway-search",
    "crates/meshy-dcc-logging",
    "crates/meshy-dcc-pybridge",
    "crates/meshy-dcc-pybridge-derive",
    "crates/meshy-dcc-paths",
    "crates/meshy-dcc-transport",
    "crates/meshy-dcc-process",
    "crates/meshy-dcc-telemetry",
    "crates/meshy-dcc-sandbox",
    "crates/meshy-dcc-shm",
    "crates/meshy-dcc-capture",
    "crates/meshy-dcc-usd",
    "crates/meshy-dcc-http",
    "crates/meshy-dcc-http-types",
    "crates/meshy-dcc-http-server",
    "crates/meshy-dcc-http-py",
    "crates/meshy-dcc",
    "crates/meshy-dcc-server",
    "crates/meshy-dcc-sidecar",
    "crates/meshy-dcc-workflow",
    "crates/meshy-dcc-scheduler",
    "crates/meshy-dcc-artefact",
    "crates/meshy-dcc-host",
    "crates/meshy-dcc-host-rpc",
    "crates/meshy-dcc-tunnel-protocol",
    "crates/meshy-dcc-tunnel-relay",
    "crates/meshy-dcc-tunnel-agent",
    "crates/meshy-dcc-marketplace",
    "crates/meshy-dcc-catalog",
    "crates/meshy-dcc-db",
    "crates/meshy-dcc-semantic",
    "crates/meshy-dcc-updater",
    "crates/meshy-dcc-attestation",
    "crates/meshy-dcc-test-utils",
    "crates/workspace-hack",
]
resolver = "2"

[workspace.package]
version = "0.2.1"
edition = "2024"
rust-version = "1.95"
authors = ["Meshy <support@meshy.ai>"]
license = "MIT"
repository = "https://github.com/meshy-dev/meshy-dcc-core"

[workspace.dependencies]
# Internal crates
meshy-dcc-naming = { path = "crates/meshy-dcc-naming" }
meshy-dcc-models = { path = "crates/meshy-dcc-models" }
meshy-dcc-actions = { path = "crates/meshy-dcc-actions" }
meshy-dcc-skills = { path = "crates/meshy-dcc-skills" }
meshy-dcc-skills-bench = { path = "crates/meshy-dcc-skills-bench" }
meshy-dcc-protocols = { path = "crates/meshy-dcc-protocols" }
meshy-dcc-jsonrpc = { path = "crates/meshy-dcc-jsonrpc" }
meshy-dcc-wire = { path = "crates/meshy-dcc-wire" }
meshy-dcc-job = { path = "crates/meshy-dcc-job" }
meshy-dcc-skill-rest = { path = "crates/meshy-dcc-skill-rest" }
meshy-dcc-logging = { path = "crates/meshy-dcc-logging" }
meshy-dcc-pybridge = { path = "crates/meshy-dcc-pybridge" }
meshy-dcc-pybridge-derive = { path = "crates/meshy-dcc-pybridge-derive" }
meshy-dcc-paths = { path = "crates/meshy-dcc-paths" }
meshy-dcc-transport = { path = "crates/meshy-dcc-transport" }
meshy-dcc-process = { path = "crates/meshy-dcc-process" }
meshy-dcc-telemetry = { path = "crates/meshy-dcc-telemetry" }
meshy-dcc-sandbox = { path = "crates/meshy-dcc-sandbox" }
meshy-dcc-shm = { path = "crates/meshy-dcc-shm" }
meshy-dcc-capture = { path = "crates/meshy-dcc-capture" }
meshy-dcc-usd = { path = "crates/meshy-dcc-usd" }
meshy-dcc-http = { path = "crates/meshy-dcc-http" }
meshy-dcc-http-types = { path = "crates/meshy-dcc-http-types" }
meshy-dcc-http-server = { path = "crates/meshy-dcc-http-server" }
meshy-dcc-http-py = { path = "crates/meshy-dcc-http-py" }
meshy-dcc = { path = "crates/meshy-dcc" }
meshy-dcc-server = { path = "crates/meshy-dcc-server" }
meshy-dcc-sidecar = { path = "crates/meshy-dcc-sidecar" }
meshy-dcc-workflow = { path = "crates/meshy-dcc-workflow" }
meshy-dcc-scheduler = { path = "crates/meshy-dcc-scheduler" }
meshy-dcc-artefact = { path = "crates/meshy-dcc-artefact" }
meshy-dcc-host = { path = "crates/meshy-dcc-host" }
meshy-dcc-host-rpc = { path = "crates/meshy-dcc-host-rpc" }
meshy-dcc-tunnel-protocol = { path = "crates/meshy-dcc-tunnel-protocol" }
meshy-dcc-tunnel-relay = { path = "crates/meshy-dcc-tunnel-relay" }
meshy-dcc-tunnel-agent = { path = "crates/meshy-dcc-tunnel-agent" }
meshy-dcc-marketplace = { path = "crates/meshy-dcc-marketplace" }
meshy-dcc-catalog = { path = "crates/meshy-dcc-catalog" }
meshy-dcc-db = { path = "crates/meshy-dcc-db" }
meshy-dcc-gateway = { path = "crates/meshy-dcc-gateway" }
meshy-dcc-gateway-admin = { path = "crates/meshy-dcc-gateway-admin" }
meshy-dcc-gateway-core = { path = "crates/meshy-dcc-gateway-core" }
meshy-dcc-updater = { path = "crates/meshy-dcc-updater" }
meshy-dcc-attestation = { path = "crates/meshy-dcc-attestation" }
meshy-dcc-gateway-ensure = { path = "crates/meshy-dcc-gateway-ensure" }
meshy-dcc-gateway-search = { path = "crates/meshy-dcc-gateway-search" }
meshy-dcc-semantic = { path = "crates/meshy-dcc-semantic" }
meshy-dcc-test-utils = { path = "crates/meshy-dcc-test-utils" }

# Shared dependencies (single version across workspace)
pyo3 = { version = "0.29", features = ["multiple-pymethods"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
jsonschema = "0.28"
serde_yaml_ng = "0.10"
semver = "1.0"
toon-format = { version = "0.5", default-features = false }
dashmap = "6.1"
dirs = "6.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tracing-tracy = { version = "=0.11.4", default-features = false, features = ["enable", "ondemand", "only-localhost"] }
time = { version = "0.3", features = ["formatting", "macros", "local-offset"] }
parking_lot = "0.12"
thiserror = "2.0"
uuid = { version = "1.0", features = ["v4", "v5", "serde"] }
tokio = { version = "1.0", features = ["net", "rt-multi-thread", "sync", "time", "macros", "io-util", "signal"] }
rmp-serde = "1.3"
sysinfo = "0.39"
memmap2 = "0.9"
lz4_flex = { version = "0.13", default-features = false, features = ["frame"] }
libc = "0.2"
notify = "8.0"
anyhow = "1.0"
tokio-tungstenite = "0.29"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["blocking", "json", "stream", "rustls"] }
socket2 = { version = "0.6", features = ["all"] }
mdns-sd = { version = "0.20", default-features = false, features = ["async"] }
criterion = { version = "0.8", features = ["html_reports"] }
ipckit = { version = "0.1.7", features = ["async", "backend-interprocess"] }
base64 = "0.22"
# Optional SQLite backend for JobManager persistence (issue #328). Pulled in
# only when the `job-persist-sqlite` feature is enabled on `meshy-dcc-http`;
# otherwise zero SQLite code compiles into the wheel.
rusqlite = { version = "0.39", features = ["bundled"] }
axum = "0.8"
tower = "0.5"
tower-http = "0.6"
tempfile = "3"
sha2 = "0.11"
# `chacha` pins corpus generation to a named generator (ChaCha8Rng). `StdRng`
# makes no cross-version reproducibility guarantee, and the skills benchmark
# needs its seeded corpus to be stable across `rand` patch bumps.
rand = { version = "0.10", features = ["chacha"] }
http = "1.0"
futures = "0.3"
async-trait = "0.1"

# Safe zero-copy (de)serialisation for shared-memory headers.
bytemuck = { version = "1.22", features = ["derive", "extern_crate_alloc", "min_const_generics"] }

# JWT bearer auth for the tunnel relay (issue #504). HS256 today; RS256/EdDSA
# can be added in a later PR without touching the protocol crate's public API.
# jsonwebtoken 10.x is a security upgrade (CVE-2026-25537 — TryParse
# type-confusion bypass). v10 made the crypto backend non-default; we pick
# `rust_crypto` for portability across the wheels we ship (it works on every
# host without `aws-lc-rs`'s build-time C toolchain requirement).
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto"] }

# Official Rust MCP SDK (issue #985). Provides MCP Streamable HTTP transport
# via modelcontextprotocol/rust-sdk.
rmcp = { version = "2.1", features = ["transport-streamable-http-server"] }

# Type-stub generation (opt-in via `stub-gen` feature). Used only by the
# `stub_gen` binary target — never pulled into wheels or library consumers.
pyo3-stub-gen = "0.23.1"
pyo3-stub-gen-derive = "0.23.1"

[workspace.lints.clippy]
# Warn when a Result / error value can be silently dropped (issue #844).
must_use_candidate = "warn"

# Root package — Python bindings entry point
# Compiles to `_core.pyd` / `_core.so`, exposed as `meshy_dcc_core._core`
[package]
name = "meshy-dcc-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Foundational library for the DCC Model Context Protocol (MCP) ecosystem"
keywords = ["dcc", "mcp", "maya", "blender", "houdini", "pyo3"]

[lib]
name = "_core"
crate-type = ["cdylib", "rlib"]

[dependencies]
# Internal crates
meshy-dcc-naming.workspace = true
meshy-dcc-models.workspace = true
meshy-dcc-actions.workspace = true
meshy-dcc-skills.workspace = true
meshy-dcc-protocols.workspace = true
meshy-dcc-logging.workspace = true
meshy-dcc-pybridge.workspace = true
meshy-dcc-paths.workspace = true
meshy-dcc-transport.workspace = true
meshy-dcc-process.workspace = true
meshy-dcc-telemetry.workspace = true
meshy-dcc-sandbox.workspace = true
meshy-dcc-shm.workspace = true
meshy-dcc-capture.workspace = true
meshy-dcc-usd.workspace = true
meshy-dcc-http.workspace = true
meshy-dcc-http-py.workspace = true
meshy-dcc-artefact.workspace = true
meshy-dcc-host.workspace = true
meshy-dcc-wire.workspace = true

# Workflow crate — opt-in via the top-level `workflow` feature.
meshy-dcc-workflow = { workspace = true, optional = true }

# Scheduler crate — opt-in via the top-level `scheduler` feature (issue #352).
meshy-dcc-scheduler = { workspace = true, optional = true }

# Gateway crate — opt-in via the top-level `admin` feature.
meshy-dcc-gateway = { workspace = true, optional = true }

# PyO3 (optional — only for wheel builds)
pyo3 = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }

# Type-stub generation (opt-in via `stub-gen` feature, used by the
# `stub_gen` binary target only).
pyo3-stub-gen = { workspace = true, optional = true }
workspace-hack = { version = "0.1", path = "crates/workspace-hack" }

[dev-dependencies]
serde_json.workspace = true

# PoC binary: generate python/meshy_dcc_core/_core.pyi from annotated Rust code.
# Build with: cargo run --bin stub_gen --features stub-gen
[[bin]]
name = "stub_gen"
path = "src/bin/stub_gen.rs"
required-features = ["stub-gen"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true

# Published binaries and wheels. `.cargo/config.toml` turns `release` down for
# fast local builds; nothing overrides `dist`.
[profile.dist]
inherits = "release"
opt-level = 3
lto = true
codegen-units = 1
strip = true
debug = false
split-debuginfo = "off"

[features]
default = []
python-bindings = ["pyo3", "dep:reqwest", "meshy-dcc-naming/python-bindings", "meshy-dcc-models/python-bindings", "meshy-dcc-actions/python-bindings", "meshy-dcc-skills/python-bindings", "meshy-dcc-protocols/python-bindings", "meshy-dcc-logging/python-bindings", "meshy-dcc-pybridge/python-bindings", "meshy-dcc-paths/python-bindings", "meshy-dcc-transport/python-bindings", "meshy-dcc-process/python-bindings", "meshy-dcc-telemetry/python-bindings", "meshy-dcc-sandbox/python-bindings", "meshy-dcc-shm/python-bindings", "meshy-dcc-capture/python-bindings", "meshy-dcc-usd/python-bindings", "meshy-dcc-http-py/python-bindings", "meshy-dcc-artefact/python-bindings", "meshy-dcc-host/python-bindings", "meshy-dcc-wire/python-bindings", "meshy-dcc-workflow?/python-bindings", "meshy-dcc-scheduler?/python-bindings"]
# Opt into the first-class Workflow primitive (issue #348). Off by default
# for one release — enables WorkflowSpec/WorkflowStatus in Python and the
# workflows.* built-in tools in Rust. Step execution is stubbed; see #348.
workflow = ["dep:meshy-dcc-workflow"]
# Opt into the scheduler subsystem (issue #352). Off by default — enables
# the cron + webhook-triggered workflow scheduler and exposes
# ScheduleSpec / TriggerSpec in Python. Requires the `workflow` feature.
scheduler = ["dep:meshy-dcc-scheduler", "workflow"]
# Enable the Prometheus `/metrics` exporter (issue #331). Off by default.
# Forwards to meshy-dcc-http/prometheus, which in turn enables the
# prometheus feature on meshy-dcc-telemetry. When disabled, zero
# Prometheus code is compiled into the wheel.
prometheus = ["meshy-dcc-http/prometheus", "meshy-dcc-telemetry/prometheus"]
# Persist JobManager state in SQLite so tracked jobs survive restarts
# (issue #328). Forwards to `meshy-dcc-http/job-persist-sqlite`. Off by
# default — when disabled, zero SQLite code compiles into the wheel.
job-persist-sqlite = ["meshy-dcc-http/job-persist-sqlite"]
# Enable the admin UI (Vite bundle in gateway). Forwards to both the
# direct `meshy-dcc-gateway` dep and, crucially, the gateway pulled in via
# `meshy-dcc-http`'s default `auto-gateway` feature (issue #2182). Off by
# default — when disabled, zero admin UI code or front-end assets are
# compiled into the wheel.
admin = ["meshy-dcc-gateway/admin", "meshy-dcc-http/admin"]
# Route explicitly negotiated MCP 2026-07-28 requests through the stateless
# HTTP service while retaining the legacy session path.
mcp-2026-07-28 = ["meshy-dcc-http/mcp-2026-07-28"]
# Persist gateway admin state in SQLite (bundled `rusqlite`). Off by default
# so the admin-persist-sqlite path no longer compiles the bundled `rusqlite`
# driver (issue #2182). Note: the gateway's traffic-capture sink still depends
# on `rusqlite` unconditionally; a separate follow-up is needed to fully
# eliminate bundled SQLite from the default wheel.
admin-persist-sqlite = ["meshy-dcc-http/admin-persist-sqlite", "meshy-dcc-gateway/admin-persist-sqlite"]
# Opt-in local Tracy profiling through the existing logging subscriber.
tracy = ["meshy-dcc-logging/tracy"]

# py37-lite: pure-Python wheel profile for Maya 2022 / Python 3.7.
# Intentionally empty: ``build-py37`` only packages ``python/`` sources and
# must not compile Rust (see ``scripts/build_py37_pure_wheel.py``).
# See also `build-py37` in justfile and the py37-lite CI workflows.
py37-lite = []
abi3-py38 = ["pyo3/abi3-py38"]
# Python 3.7 wheel: non-abi3 build, no abi3-py38 feature
ext-module = ["pyo3/extension-module"]
# Generate `python/meshy_dcc_core/_core.pyi` from annotated Rust code.
# PoC scope: currently only meshy-dcc-capture is annotated.
stub-gen = [
    "python-bindings",
    "dep:pyo3-stub-gen",
    "meshy-dcc-naming/stub-gen",
    "meshy-dcc-models/stub-gen",
    "meshy-dcc-actions/stub-gen",
    "meshy-dcc-skills/stub-gen",
    "meshy-dcc-protocols/stub-gen",
    "meshy-dcc-logging/stub-gen",
    "meshy-dcc-pybridge/stub-gen",
    "meshy-dcc-paths/stub-gen",
    "meshy-dcc-transport/stub-gen",
    "meshy-dcc-process/stub-gen",
    "meshy-dcc-telemetry/stub-gen",
    "meshy-dcc-sandbox/stub-gen",
    "meshy-dcc-shm/stub-gen",
    "meshy-dcc-capture/stub-gen",
    "meshy-dcc-usd/stub-gen",
    "meshy-dcc-http-py/stub-gen",
    "meshy-dcc-artefact/stub-gen",
    "meshy-dcc-wire/stub-gen",
    "meshy-dcc-workflow/stub-gen",
    "meshy-dcc-scheduler/stub-gen",
]
