[package]
name = "meshy-dcc-lifecycle"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
meshy-dcc-catalog.workspace = true
meshy-dcc-attestation.workspace = true
meshy-dcc-gateway-ensure.workspace = true
meshy-dcc-jsonrpc.workspace = true
meshy-dcc-models.workspace = true
meshy-dcc-transport.workspace = true
meshy-dcc-updater.workspace = true
anyhow.workspace = true
dirs.workspace = true
reqwest.workspace = true
semver.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
thiserror.workspace = true
tokio.workspace = true
toon-format.workspace = true
uuid.workspace = true
glob = "0.3"
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
hex = "0.4"
axum = { workspace = true, features = ["http1", "tokio"] }
meshy-dcc-test-utils.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading"] }
