[package]
name = "meshy-dcc-marketplace"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "Shared marketplace domain layer for catalog fetch, install/uninstall, source management, and integrity verification"

[dependencies]
meshy-dcc-attestation.workspace = true
meshy-dcc-catalog.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_yaml_ng.workspace = true
serde_json.workspace = true
semver.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
zip = { version = "2", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile.workspace = true
meshy-dcc-test-utils = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
