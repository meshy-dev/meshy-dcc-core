[package]
name = "meshy-dcc-http"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "MCP Streamable HTTP server for DCC applications (axum-based, thread-safe)"

[dependencies]
# Internal crates
meshy-dcc-http-types = { workspace = true }
meshy-dcc-http-server = { workspace = true }
meshy-dcc-actions = { workspace = true }
meshy-dcc-naming = { workspace = true }
meshy-dcc-protocols = { workspace = true }
meshy-dcc-jsonrpc = { workspace = true }
meshy-dcc-job = { workspace = true }
meshy-dcc-skill-rest = { workspace = true }
# Optional via the `auto-gateway` feature (default-on). Embedders that
# only need the per-Meshy DCC HTTP server (no first-wins election, no
# admin UI, no aggregation) can opt out with `default-features = false`
# and drop the whole gateway code path / dependency tree (issue #1357).
# Gateway sub-features (admin UI, SQLite persistence) are NOT enabled
# here — they are forwarded through the `admin` / `admin-persist-sqlite`
# feature gates below so the default wheel path pulls in neither the Vite
# admin bundle nor the Prometheus exporter (issue #2182).
meshy-dcc-gateway = { workspace = true, optional = true }
meshy-dcc-models = { workspace = true }
meshy-dcc-skills = { workspace = true }
meshy-dcc-pybridge = { workspace = true, optional = true }
meshy-dcc-transport = { workspace = true }
meshy-dcc-sandbox = { workspace = true }
meshy-dcc-capture = { workspace = true }
meshy-dcc-telemetry = { workspace = true, optional = true }
meshy-dcc-workflow = { workspace = true }
meshy-dcc-artefact = { workspace = true }
meshy-dcc-host = { workspace = true }

# Workspace shared
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
dashmap = { workspace = true }
reqwest = { workspace = true }
socket2 = { workspace = true }
parking_lot = { workspace = true }
chrono = { version = "0.4", features = ["serde"] }
base64 = { workspace = true }
serde_yaml_ng = { workspace = true }
tokio-util = { version = "0.7", features = ["rt"] }

# HTTP server
# MCP Streamable HTTP uses HTTP/1.1 SSE; http2 is not required and pulls in
# the heavy `h2` crate — keep it disabled for faster builds.
axum = { workspace = true, features = ["http1", "tokio"] }
tower = { workspace = true, features = ["util"] }
tower-http = { workspace = true, features = ["cors", "trace", "limit"] }
http.workspace = true
http-body-util = "0.1"
futures.workspace = true
tokio-stream = { version = "0.1", features = ["sync", "tokio-util"] }
pin-project-lite = "0.2"

# High-performance fuzzy matcher for the capability search layer
# (issue #659). Now lives in the extracted `meshy-dcc-gateway` crate.

# PyO3 (optional)
pyo3 = { workspace = true, optional = true }

# Official MCP SDK — provides rmcp StreamableHttpService transport.
rmcp = { workspace = true }

# Type-stub generation (opt-in via `stub-gen` feature).
pyo3-stub-gen = { workspace = true, optional = true }
pyo3-stub-gen-derive = { workspace = true, optional = true }

# Optional SQLite JobStorage backend (issue #328). Gated behind the
# `job-persist-sqlite` feature so the default build has zero SQLite cost.
# Now actually lives in `meshy-dcc-job`; this crate just forwards the
# feature flag for backwards compatibility.
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
serde_json.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "test-util"] }
axum-test = "20"
rstest = "0.26"
tempfile.workspace = true
meshy-dcc-sandbox = { workspace = true }
# Enable `auto-initialize` only during testing so the in-crate Rust
# tests that exercise PyO3 surface (e.g. `python::resources_handle`
# issue #730) can spin up an embedded Python interpreter automatically.
# Production wheels do NOT pull this in.
pyo3 = { workspace = true, features = ["auto-initialize"] }

[features]
default = ["auto-gateway"]
# Wires the first-wins gateway election + aggregation runtime into
# `McpHttpServer::start()` so a single embedded server can also act as
# the LAN gateway (default behavior, issue #1357). Turning this off
# drops the entire `meshy-dcc-gateway` dep — `gateway_port` becomes a
# no-op and `cargo tree -p meshy-dcc-http --no-default-features` shows
# no aggregation tier.
auto-gateway = ["dep:meshy-dcc-gateway"]
# Forward the admin UI to the gateway when it is pulled in via
# `auto-gateway` (issue #2182). Opt-in only — the default `auto-gateway`
# path does NOT enable this, so the Vite admin bundle stays out of the
# default wheel.
admin = ["meshy-dcc-gateway?/admin"]
# Forward gateway SQLite persistence (bundled `rusqlite`) when the gateway
# is present. Opt-in only (issue #2182).
admin-persist-sqlite = ["meshy-dcc-gateway?/admin-persist-sqlite"]
mdns = ["meshy-dcc-gateway?/mdns"]
python-bindings = ["pyo3", "meshy-dcc-actions/python-bindings", "meshy-dcc-skills/python-bindings", "meshy-dcc-artefact/python-bindings", "dep:meshy-dcc-pybridge", "meshy-dcc-pybridge/python-bindings", "meshy-dcc-host/python-bindings"]
# Enable `pyo3-stub-gen` annotations on this crate's PyO3 types.
stub-gen = ["python-bindings", "dep:pyo3-stub-gen", "dep:pyo3-stub-gen-derive"]
# Enable the Prometheus `/metrics` endpoint (issue #331). Pulls in the
# matching `prometheus` feature of meshy-dcc-telemetry. Off by default so
# zero Prometheus code compiles into the wheel when not requested. The
# `meshy-dcc-gateway?/prometheus` form only enables the gateway sub-
# feature when `auto-gateway` already pulled the dep in.
prometheus = ["dep:meshy-dcc-telemetry", "meshy-dcc-telemetry/prometheus", "meshy-dcc-gateway?/prometheus", "meshy-dcc-http-server/prometheus"]
# Persist tracked Jobs in a SQLite database so they survive a server
# restart (issue #328). Pulls in the bundled `rusqlite` driver via the
# extracted `meshy-dcc-job` crate. Off by default — the wheel's default
# build uses the in-memory store.
job-persist-sqlite = ["meshy-dcc-job/job-persist-sqlite"]
# Route explicitly negotiated MCP 2026-07-28 requests through the
# stateless service while retaining rmcp for legacy requests.
mcp-2026-07-28 = ["meshy-dcc-http-server/mcp-2026-07-28", "meshy-dcc-jsonrpc/mcp-2026-07-28"]
