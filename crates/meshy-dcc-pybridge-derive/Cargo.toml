[package]
name = "meshy-dcc-pybridge-derive"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
description = "Procedural derive macros for the meshy-dcc pybridge wrapper-helper layer (issue #528)"

[lib]
proc-macro = true

[dependencies]
syn = { version = "3", features = ["full", "extra-traits"] }
quote = "1"
proc-macro2 = "1"
workspace-hack = { version = "0.1", path = "../workspace-hack" }

[dev-dependencies]
# Smoke-tests live in the consumer crate (`meshy-dcc-pybridge`) so that the
# macro is exercised in a non-proc-macro build context. See
# crates/meshy-dcc-pybridge/tests/derive_smoke.rs.
