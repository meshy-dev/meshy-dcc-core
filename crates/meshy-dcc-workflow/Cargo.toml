[package]
name = "meshy-dcc-workflow"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
description = "First-class Workflow primitive (WorkflowSpec + WorkflowJob) for the Meshy DCC ecosystem — spec, executor, SQLite persistence, MCP tools."

[dependencies]
pyo3 = { workspace = true, optional = true }

# Type-stub generation (opt-in via `stub-gen` feature).
pyo3-stub-gen = { workspace = true, optional = true }
pyo3-stub-gen-derive = { workspace = true, optional = true }

meshy-dcc-naming = { workspace = true }
meshy-dcc-models = { workspace = true }
meshy-dcc-actions = { workspace = true }
meshy-dcc-artefact = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml_ng = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }
parking_lot = { workspace = true }
uuid = { workspace = true }
tokio = { workspace = true, features = ["sync", "time", "rt", "macros"] }
tokio-util = "0.7"
chrono = { version = "0.4", features = ["serde"] }
jsonpath-rust = "1.0"
glob = "0.3"
base64 = { workspace = true }

# Optional: SQLite persistence (writer + interrupted-on-restart recovery).
rusqlite = { version = "0.40", optional = true, features = ["bundled"] }
workspace-hack = { version = "0.1", path = "../workspace-hack" }
sha2.workspace = true
[dev-dependencies]
tempfile.workspace = true
tokio = { workspace = true, features = ["sync", "time", "rt", "rt-multi-thread", "macros", "test-util"] }
meshy-dcc-models = { workspace = true, features = ["testing"] }
criterion = { workspace = true }

[[bench]]
name = "pipeline_full"
harness = false

[features]
default = []
python-bindings = [
    "pyo3",
    "meshy-dcc-naming/python-bindings",
    "meshy-dcc-models/python-bindings",
    "meshy-dcc-actions/python-bindings",
    "meshy-dcc-artefact/python-bindings",
]
# Enable `pyo3-stub-gen` annotations on this crate's PyO3 types.
stub-gen = ["python-bindings", "dep:pyo3-stub-gen", "dep:pyo3-stub-gen-derive"]
# Persistence for workflows / workflow_steps tables.
job-persist-sqlite = ["dep:rusqlite"]
