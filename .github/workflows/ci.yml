name: ci

# Tests every pull request (ours and Dependabot's) and every push to main.
# Rust runs on macOS, the platform the release builds and validates on; the
# admin UI and Python checks run on Linux.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      # The gateway's admin feature builds admin-ui in its build script.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      # The Rust toolchain comes from rust-toolchain.toml.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: cargo test -p meshy-dcc -p meshy-dcc-updater
        run: cargo test -p meshy-dcc -p meshy-dcc-updater
      - name: cargo test -p meshy-dcc-gateway --features admin
        run: cargo test -p meshy-dcc-gateway --features admin

  admin-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: admin-ui
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin-ui/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx tsc -b
      - run: npx vitest run
      - run: npx playwright test --reporter=line

  python:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 -m unittest scripts/reports/test_reports.py
      - run: python3 scripts/ci/check_lock_versions.py
