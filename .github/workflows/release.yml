name: release

# Publishes one release, like meshy-cli and meshy-mcp-server: a GitHub Release
# plus npm, and a copy on the Meshy CDN for places that reach it faster.
#
# Run it by hand from the Actions tab on main ("Run workflow") with the tag of
# a GitHub Release you already created. Create that Release as a pre-release,
# not a draft: a draft is invisible to the workflow token, so the check job
# fails. Mark it as the latest release after the run succeeds. It runs from main
# on purpose: meshy-dcc trusts release manifests signed by this workflow file
# at refs/heads/main, and a release-triggered run would sign from the tag.
#
# No credentials live in GitHub. The publish and finish jobs assume the AWS role
# meshy-dcc-github-deploy through GitHub OIDC (as meshyd's msctl release
# does); that role may only write s3://meshy-cdn/meshy-dcc-core/* (served by
# cdn.meshy.ai and cdn.meshy.cn) and read the npm token from AWS Secrets
# Manager (meshy-dcc/release/npm-token). Setup: scripts/release/aws/.
#
# Order: build -> load check on the newest macOS -> publish (sign, GitHub
# Release, release files on the CDN) -> upgrade smoke test from the previous
# release on macOS and Windows -> finish (npm, install scripts, latest.txt).
# latest.txt stays the last write, so no installer or update check sees a
# release that has not passed the upgrade smoke test.
#
# The same workflow publishes the signed install catalog
# (meshy-dcc-core/catalog/install-catalog.json): meshy-dcc-catalog.yml from main
# after every listed build is downloaded and checked, signed by this workflow.
# It expires after seven days, so it is refreshed daily (see the catalog job);
# run the workflow with no tag to publish it right away, for example after an
# adapter release.
#
# dry_run builds both platforms from main for the given tag's version, runs the
# load check and publishes nothing (no GitHub Release needed); the builds stay
# as run artifacts.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag, e.g. v0.2.0; empty publishes only the install catalog"
        required: false
      dry_run:
        description: "Build from main for this tag's version; publish nothing"
        type: boolean
        default: false
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  check:
    if: inputs.tag != ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.dry_run && github.sha || inputs.tag }}
          persist-credentials: false

      - name: The workspace version matches the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)"
          if [ "v$version" != "$TAG" ]; then
            echo "::error::Cargo.toml says $version but the tag is $TAG. Bump the version (and CHANGELOG.md) first."
            exit 1
          fi

      - name: The GitHub Release exists
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null

  build:
    needs: check
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: macos-14
            platform: macos-arm64
            ext: ""
          - os: windows-latest
            platform: windows-x86_64
            ext: ".exe"
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.dry_run && github.sha || inputs.tag }}
          persist-credentials: false

      # The Rust toolchain comes from rust-toolchain.toml.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0

      - name: Build the CLI, the gateway and the core wheel
        run: scripts/release/build_release.sh out

      - name: Release files for the GitHub Release and the CDN
        env:
          TAG: ${{ inputs.tag }}
        run: |
          for source in github cdn; do
            python scripts/release/generate_update_manifest.py \
              --version "${TAG#v}" --platform "${{ matrix.platform }}" \
              --cli-bin "out/meshy-dcc${{ matrix.ext }}" \
              --server-bin "out/meshy-dcc-server${{ matrix.ext }}" \
              --out-dir "release/$source" --source "$source"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ matrix.platform }}
          path: |
            out/
            release/
          if-no-files-found: error

  load-check:
    # A wheel stripped by a newer Xcode once failed to load ("mis-aligned
    # LINKEDIT string pool") while CI builds load fine, so load the CI build on
    # the newest macOS runner. No offset check: CI binaries have
    # stroff % 8 == 4 and load fine.
    needs: build
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-macos-arm64
          path: artifacts
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Load the wheel's _core and run both binaries
        run: |
          sw_vers
          python -m venv venv
          venv/bin/pip install --no-deps artifacts/out/*.whl
          venv/bin/python -c "import meshy_dcc_core._core as core; print(core.__file__)"
          chmod +x artifacts/out/meshy-dcc artifacts/out/meshy-dcc-server
          artifacts/out/meshy-dcc --version
          artifacts/out/meshy-dcc-server --version

  publish:
    needs: [build, load-check]
    if: ${{ !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.dry_run && github.sha || inputs.tag }}
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::133081291590:role/meshy-dcc-github-deploy

      - name: Collect the release files
        run: |
          mkdir -p github cdn
          for platform in macos-arm64 windows-x86_64; do
            cp artifacts/release-$platform/release/github/* github/
            cp artifacts/release-$platform/release/cdn/* cdn/
            cp artifacts/release-$platform/out/*.whl github/
          done
          cp scripts/install-cli.sh github/install.sh
          cp scripts/install-cli.ps1 github/install.ps1

      # meshy-dcc verifies official manifests against this workflow's signature.
      - name: Sign the manifests
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            github/meshy-dcc-update-manifest-*.json
            cdn/meshy-dcc-update-manifest-*.json

      - name: Put the signature beside each manifest
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          for manifest in github/meshy-dcc-update-manifest-*.json; do
            cp "$BUNDLE" "${manifest%.json}.sigstore.json"
          done
          # CDN names allow a single extension.
          for manifest in cdn/meshy-dcc-update-manifest-*.json; do
            cp "$BUNDLE" "${manifest%.json}-sigstore.json"
          done

      # The Release is a pre-release, so `releases/latest` still names the
      # previous one until it is marked latest.
      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" github/* --repo "$GITHUB_REPOSITORY" --clobber

      # Release files only: install scripts and latest.txt wait for the upgrade
      # smoke test, which reads the new manifest from here.
      - name: Copy the release files to the Meshy CDN
        env:
          TAG: ${{ inputs.tag }}
        run: python3 scripts/release/sync_cdn.py --version "${TAG#v}" --release-dir cdn --files-only

      # The finish job uploads these same signed bytes; signing again would
      # produce different ones, which the CDN refuses to overwrite.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: signed-release
          path: |
            github/
            cdn/
          if-no-files-found: error

  upgrade-smoke:
    # Install the release latest.txt still names, point update checks at the
    # new manifest on the CDN, run `update apply --yes`, and check that the
    # CLI, the server and the restarted gateway all report the new version.
    needs: publish
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            label: macos-arm64
          - os: windows-latest
            label: windows-x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - name: Upgrade from the previous release
        env:
          TAG: ${{ inputs.tag }}
          LABEL: ${{ matrix.label }}
        run: |
          version="${TAG#v}"
          dir="v${version//./-}"
          scripts/release/upgrade_smoke.sh --install-previous --bin-dir "$RUNNER_TEMP/bin" \
            --version "$version" \
            --manifest-url "https://cdn.meshy.ai/meshy-dcc-core/$dir/meshy-dcc-update-manifest-$LABEL.json"

  finish:
    needs: upgrade-smoke
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: artifacts

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::133081291590:role/meshy-dcc-github-deploy

      # Exported as NPM_TOKEN and masked in the log.
      - uses: aws-actions/aws-secretsmanager-get-secrets@a9a7eb4e2f2871d30dc5b892576fde60a2ecc802 # v2.0.10
        with:
          secret-ids: |
            NPM_TOKEN,meshy-dcc/release/npm-token

      # Each package is skipped when that version is already on npm, so a rerun
      # after a half-finished publish picks up where it stopped.
      - name: Publish to npm
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          python3 scripts/release/build_npm_packages.py --version "$version" --out npm-out \
            --macos-arm64 artifacts/release-macos-arm64/out \
            --windows-x86_64 artifacts/release-windows-x86_64/out
          # Platform packages first, so `meshy-dcc` never points at missing ones.
          for tarball in ./npm-out/meshy-ai-*.tgz ./npm-out/meshy-dcc-*.tgz; do
            name="$(tar -xzOf "$tarball" package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0)).name')"
            if npm view "$name@$version" version > /dev/null 2>&1; then
              echo "$name@$version is already on npm; skipping"
            else
              npm publish "$tarball" --access public --provenance
            fi
          done

      # The release files are already on the CDN (the same bytes are accepted
      # again); latest.txt is written last, so installers never see a version
      # whose files are not all there yet.
      - name: Install scripts and latest.txt on the Meshy CDN
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 scripts/release/sync_cdn.py --version "${TAG#v}" \
            --release-dir artifacts/signed-release/cdn \
            --install-script artifacts/signed-release/github/install.sh \
            --install-script artifacts/signed-release/github/install.ps1

  catalog:
    # meshy-dcc trusts the catalog only when signed from main. The daily
    # refresh starts once the repository variable INSTALL_CATALOG_REFRESH is
    # "on" (set at launch); runs started by hand always publish.
    if: github.ref == 'refs/heads/main' && !inputs.dry_run && (github.event_name != 'schedule' || vars.INSTALL_CATALOG_REFRESH == 'on')
    runs-on: ubuntu-latest
    concurrency: install-catalog
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - name: Check every listed build and prepare the payload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pip install pyyaml
          python3 scripts/ci/prepare_install_catalog.py --catalog meshy-dcc-catalog.yml \
            --output catalog/payload.json --source-revision "$GITHUB_SHA"

      - name: Sign the payload
        id: attest
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: catalog/payload.json

      - name: Envelope
        env:
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          python3 - <<'PY'
          import json, os
          catalog = open("catalog/payload.json", encoding="utf-8").read()
          bundle = json.load(open(os.environ["BUNDLE"], encoding="utf-8"))
          json.dump({"catalog": catalog, "attestation": bundle}, open("catalog/install-catalog.json", "w", encoding="utf-8"))
          PY

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::133081291590:role/meshy-dcc-github-deploy

      - name: Copy to the Meshy CDN
        run: |
          aws s3 cp catalog/install-catalog.json s3://meshy-cdn/meshy-dcc-core/catalog/install-catalog.json \
            --content-type application/json --cache-control no-cache
