      reason: "The Meshy ZBrush adapter is planned."

  - name: "meshy-dcc-roblox"
    description: "Meshy DCC adapter for Roblox Studio (planned)"
    dcc: ["roblox"]
    url: "https://www.meshy.ai"
    tags: ["adapter", "meshy", "roblox"]
