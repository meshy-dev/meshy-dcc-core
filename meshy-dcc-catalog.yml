# Meshy DCC Core install catalog, bundled into `meshy-dcc`.
#
# One entry per DCC with a Meshy adapter. A DCC joins by adding an entry: core
# has no per-DCC code, it only runs what the entry declares.
#
# `host-package` installs download `url`, check `sha256`, then run the `host`
# commands (argv lists, no shell) with the executable the operator passed via
# `--dcc-path`. `host.launch` becomes the start-instance launch plan.
#
# Entries stay `policy.installation: not_available` until their adapter build
# is published under https://cdn.meshy.ai/meshy-dcc-core/adapters/. Test
# unpublished builds with `meshy-dcc install --catalog <file>`.

version: "1"

entries:
  - name: "meshy-dcc-blender"
    description: "Meshy DCC adapter for Blender 4.5+: scene, import, materials and render tools"
    dcc: ["blender"]
    url: "https://www.meshy.ai"
    tags: ["adapter", "meshy", "blender"]
    version: "0.1.0"
    maintainer: "Meshy"
    policy:
      installation: not_available
      reason: "The Meshy Blender adapter build is not published yet."
    install:
      type: host-package
      url: "https://cdn.meshy.ai/meshy-dcc-core/adapters/blender/0.1.0/meshy_dcc_blender_addon_macos_v0.1.0.zip"
      sha256: "f5ef96d19de941b87e82dafc329b627bda6625bed660f82025560b41b97a77f8"
      host:
        uninstall:
          - ["{dcc_path}", "--command", "extension", "remove", "user_default.meshy_dcc_blender"]
        steps:
          - ["{dcc_path}", "--command", "extension", "install-file", "-r", "user_default", "-e", "{package}"]
        launch: ["{executable}"]

  - name: "meshy-dcc-unity"
    description: "Meshy DCC adapter for the Unity Editor 2018.4+: project, scene, model import, PBR materials and build tools"
    dcc: ["unity"]
    url: "https://www.meshy.ai"
    tags: ["adapter", "meshy", "unity"]
    version: "0.1.0"
    maintainer: "Meshy"
    policy:
      installation: not_available
      reason: "The Meshy Unity adapter build is not published yet."
    # Installs per project: `meshy-dcc install --dcc-type unity --project <root>`.
    install:
      type: host-package
      url: "https://cdn.meshy.ai/meshy-dcc-core/adapters/unity/0.1.0/meshy_dcc_unity_macos_arm64_v0.1.0.zip"
      sha256: "90f1758e8117ce4e65901a2d570078302d878fab9faab8b8c746b100712db681"
      host:
        extract: true
        project_steps:
          - ["{package_dir}/bin/meshy-dcc-unity-sidecar", "install", "--project", "{project}", "--sidecar", "{package_dir}/bin/meshy-dcc-unity-sidecar", "--files-only", "--yes", "--json"]

  - name: "meshy-dcc-godot"
    description: "Meshy DCC adapter for Godot (planned)"
    dcc: ["godot"]
    url: "https://www.meshy.ai"
