# Meshy DCC Core install catalog, bundled into `meshy-dcc`.
#
# Meshy-owned entries for the Meshy DCCs, plus the upstream entries named under
# `upstream`. A DCC joins by adding an entry: core has no per-DCC code, it only
# runs what the entry declares.
#
# `host-package` installs download `url`, check `sha256`, then run the `host`
# commands (argv lists, no shell) with the executable the operator passed via
# `--dcc-path`. `host.launch` becomes the start-instance launch plan.
#
# Entries stay `policy.installation: not_available` until their adapter build
# is published under https://cdn.meshy.ai/meshy-dcc-core/adapters/. Test
# unpublished builds with `meshy-dcc install --catalog <file>`.
#
# `upstream` names entries taken as they are from the upstream dcc-mcp catalog
# (dcc-mcp-catalog.yml, kept in the repository and updated by patches). While a
# Meshy entry is not_available, a named upstream entry for the same DCC is used
# instead, so the host stays installable until the Meshy adapter is published.
# Other upstream adapters are not bundled; they are meant to be offered as
# opt-in packages in the Meshy marketplace.

version: "1"

upstream:
  # Interim adapters for Meshy DCCs whose Meshy build is not published yet.
  - "dcc-mcp-blender"
  - "dcc-mcp-unity"
  - "dcc-mcp-godot"
  - "dcc-mcp-unreal"
  - "dcc-mcp-zbrush"
  - "dcc-mcp-maya"
  - "dcc-mcp-3dsmax"
  # Further DCCs, at upstream versions.
  - "dcc-mcp-houdini"
  - "dcc-mcp-cinema4d"
  - "dcc-mcp-marmoset"
  - "dcc-mcp-substance3d-painter"
  - "dcc-mcp-substance3d-designer"
  - "dcc-mcp-mari"
  - "dcc-mcp-openusd"
  - "dcc-mcp-katana"
  - "dcc-mcp-mobu"
  - "dcc-mcp-sketchup"
  - "dcc-mcp-freecad"
  - "dcc-mcp-openscad"
  - "dcc-mcp-material-maker"
  - "dcc-mcp-photoshop"

entries:
  - name: "meshy-dcc-blender"
    description: "Meshy DCC adapter for Blender 4.5+: scene, import, materials and render tools"
    dcc: ["blender"]
    url: "https://www.meshy.ai"
    tags: ["adapter", "meshy", "blender"]
    version: "0.2.11"
    maintainer: "Meshy"
    policy:
      installation: not_available
      reason: "The Meshy Blender adapter build is not published yet."
    install:
      type: host-package
      url: "https://cdn.meshy.ai/meshy-dcc-core/adapters/blender/0.2.11/dcc_mcp_blender_addon_macos_v0.2.11.zip"
      sha256: "b91a136be5af9a13b6dc8d6d3c914de997a135748b6a70200ef388f5de0c937b"
      host:
        uninstall:
          - ["{dcc_path}", "--command", "extension", "remove", "user_default.dcc_mcp_blender"]
        steps:
          - ["{dcc_path}", "--command", "extension", "install-file", "-r", "user_default", "-e", "{package}"]
        launch: ["{executable}"]

  - name: "meshy-dcc-unity"
    description: "Meshy DCC adapter for Unity (planned)"
    dcc: ["unity"]
    url: "https://www.meshy.ai"
    tags: ["adapter", "meshy", "unity"]
    maintainer: "Meshy"
    policy:
      installation: not_available
      reason: "The Meshy Unity adapter is in development."

  - name: "meshy-dcc-godot"
    description: "Meshy DCC adapter for Godot (planned)"
    dcc: ["godot"]
    url: "https://www.meshy.ai"
    tags: ["adapter", "meshy", "godot"]
    maintainer: "Meshy"
    policy:
      installation: not_available
      reason: "The Meshy Godot adapter is in development."

  - name: "meshy-dcc-unreal"
    description: "Meshy DCC adapter for Unreal Engine (planned)"
    dcc: ["unreal"]
    url: "https://www.meshy.ai"
    tags: ["adapter", "meshy", "unreal"]
    maintainer: "Meshy"
    policy:
      installation: not_available
      reason: "The Meshy Unreal adapter is planned."

  - name: "meshy-dcc-zbrush"
    description: "Meshy DCC adapter for ZBrush 2026.1+ (planned)"
    dcc: ["zbrush"]
    url: "https://www.meshy.ai"
    tags: ["adapter", "meshy", "zbrush"]
    maintainer: "Meshy"
    policy:
