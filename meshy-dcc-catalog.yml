entries:
  - name: "meshy-dcc-blender"
    description: "Meshy DCC adapter for Blender 4.5+: scene, import, materials and render tools"
    dcc: ["blender"]
    url: "https://www.meshy.ai"
    tags: ["adapter", "meshy", "blender"]
    version: "0.2.11"
    maintainer: "Meshy"
    policy:
      installation: not_available
      reason: "The Meshy Blender adapter build is not published yet."
    install:
      type: host-package
      url: "https://cdn.meshy.ai/meshy-dcc-core/adapters/blender/0.2.11/dcc_mcp_blender_addon_macos_v0.2.11.zip"
      sha256: "b91a136be5af9a13b6dc8d6d3c914de997a135748b6a70200ef388f5de0c937b"
      host:
        uninstall:
          - ["{dcc_path}", "--command", "extension", "remove", "user_default.dcc_mcp_blender"]
        steps:
          - ["{dcc_path}", "--command", "extension", "install-file", "-r", "user_default", "-e", "{package}"]
        launch: ["{executable}"]

