          sha256: "9c9be24f7b3b42fd659e60eece028e22404ff274a8f5860d6382064058cbaf7b"
          mirrors: ["https://cdn.meshy.cn/meshy-dcc-core/adapters/godot/v0-1-0/meshy-dcc-godot-windows-x64.zip", "https://github.com/meshy-dev/meshy-dcc-adapters/releases/download/godot-v0.1.0/meshy_dcc_godot_windows_x86_64_v0.1.0.zip"]
          host:
