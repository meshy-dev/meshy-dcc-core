# Meshy DCC Core install catalog, bundled into `meshy-dcc`.
#
# One entry per DCC with a Meshy adapter. A DCC joins by adding an entry: core
# has no per-DCC code, it only runs what the entry declares.
#
# `host-package` installs download the running platform's build from
# `platforms` (`macos-arm64`, `windows-x86_64`), check its `sha256`, then run the `host`
# commands (argv lists, no shell) with the host executable: the one the
# operator passed via `--dcc-path`, else the single match of the platform's
# `dcc_paths` globs (`~/` is home; Windows leading roots are `%ProgramFiles%`,
# `%ProgramFiles(x86)%` and `%LOCALAPPDATA%`). Expanded roots are literal paths.
# Literal Windows/home fallbacks remain for older Core catalog consumers; current
# Core deduplicates roots and symlink aliases that resolve to the same executable.
# `host.launch` becomes the start-instance launch plan.
#
# The meshy-dcc-adapters repository publishes each adapter's builds on a
# GitHub Release tagged `<host>-v<version>`; a copy goes to https://cdn.meshy.ai/meshy-dcc-core/adapters/<host>/<version dir>/
# under CDN names. `url` is the CDN copy; `mirrors` are the same object on
# cdn.meshy.cn (same bucket; cdn.meshy.ai does not resolve in mainland China)
# and the GitHub Release, tried in that order when a download fails. Entries stay
# `policy.installation: not_available` until their build is published. Test
# unpublished builds with `meshy-dcc install --catalog <file>`.

version: "1"

entries:
  - name: "meshy-dcc-blender"
    description: "Meshy DCC adapter for Blender 4.5+: scene, import, materials and render tools"
    dcc: ["blender"]
    url: "https://www.meshy.ai"
    tags: ["adapter", "meshy", "blender"]
    version: "0.1.2"
    maintainer: "Meshy"
    policy:
      installation: available
    install:
      type: host-package
      platforms:
        macos-arm64:
          url: "https://cdn.meshy.ai/meshy-dcc-core/adapters/blender/v0-1-2/meshy-dcc-blender-macos-arm64.zip"
          sha256: "fe810169f6e371b54c32f0fe3d9722ebc6b8facb2dac09dbe04113d0e5b11276"
          mirrors: ["https://cdn.meshy.cn/meshy-dcc-core/adapters/blender/v0-1-2/meshy-dcc-blender-macos-arm64.zip", "https://github.com/meshy-dev/meshy-dcc-adapters/releases/download/blender-v0.1.2/meshy-dcc-blender-macos-arm64.zip"]
          dcc_paths:
            - "/Applications/Blender.app/Contents/MacOS/Blender"
            - "~/Applications/Blender.app/Contents/MacOS/Blender"
            - "~/Library/Application Support/Steam/steamapps/common/Blender/Blender.app/Contents/MacOS/Blender"
        windows-x86_64:
          url: "https://cdn.meshy.ai/meshy-dcc-core/adapters/blender/v0-1-2/meshy-dcc-blender-windows-x64.zip"
          sha256: "04f22468f7d76c7beed73a7bb58ad83c319722b802ab569fa1a6c53fdac76d18"
          mirrors: ["https://cdn.meshy.cn/meshy-dcc-core/adapters/blender/v0-1-2/meshy-dcc-blender-windows-x64.zip", "https://github.com/meshy-dev/meshy-dcc-adapters/releases/download/blender-v0.1.2/meshy-dcc-blender-windows-x64.zip"]
          dcc_paths:
            - "%ProgramFiles%/Blender Foundation/Blender */blender.exe"
            - "C:/Program Files/Blender Foundation/Blender */blender.exe"
            - "%ProgramFiles(x86)%/Steam/steamapps/common/Blender/blender.exe"
            - "C:/Program Files (x86)/Steam/steamapps/common/Blender/blender.exe"
      host:
        software_homepage: "https://www.blender.org/"
        uninstall:
          - ["{dcc_path}", "--command", "extension", "remove", "user_default.meshy_dcc_blender"]
        steps:
          - ["{dcc_path}", "--command", "extension", "install-file", "-r", "user_default", "-e", "{package}"]
        launch: ["{executable}"]

