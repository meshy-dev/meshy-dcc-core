# Meshy DCC Core install catalog, bundled into `meshy-dcc`.
#
# Meshy-owned entries for the Meshy DCCs, plus the upstream entries named under
# `upstream`. A DCC joins by adding an entry: core has no per-DCC code, it only
# runs what the entry declares.
#
# `host-package` installs download `url`, check `sha256`, then run the `host`
# commands (argv lists, no shell) with the executable the operator passed via
# `--dcc-path`. `host.launch` becomes the start-instance launch plan.
#
# Entries stay `policy.installation: not_available` until their adapter build
# is published under https://cdn.meshy.ai/meshy-dcc-core/adapters/. Test
# unpublished builds with `meshy-dcc install --catalog <file>`.
#
# `upstream` names entries taken as they are from the upstream dcc-mcp catalog
# (dcc-mcp-catalog.yml, kept in the repository and updated by patches). While a
# Meshy entry is not_available, a named upstream entry for the same DCC is used
# instead, so the host stays installable until the Meshy adapter is published.
# Other upstream adapters are not bundled; they are meant to be offered as
# opt-in packages in the Meshy marketplace.

version: "1"

