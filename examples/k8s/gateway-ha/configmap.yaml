apiVersion: v1
kind: ConfigMap
metadata:
  name: meshy-dcc-gateway-config
  labels:
    app.kubernetes.io/name: meshy-dcc-gateway
data:
  MESHY_DCC_GATEWAY_PORT: "19765"
  MESHY_DCC_REGISTRY_DIR: "/var/lib/meshy-dcc/registry"
  MESHY_DCC_LOG_DIR: "/var/log/meshy-dcc"
  MESHY_DCC_HEARTBEAT_INTERVAL: "2"
  MESHY_DCC_STALE_TIMEOUT: "10"
  MESHY_DCC_SERVER_NAME: "meshy-dcc-gateway"
  MESHY_DCC_DCC: "generic"
