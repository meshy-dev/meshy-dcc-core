# HA topology for meshy-dcc-server gateway.
#
#   client ──▶ (host 127.0.0.1:19765) ──▶ gateway-a
#                                    \─▶ gateway-b (election runner-up)
#
# Both gateways share a single /var/lib/meshy-dcc volume so every replica sees
# the same FileRegistry. Two mock DCC servers register themselves on startup.
#
# In real deployments the host port 19765 is replaced by an external LB
# (nginx, ALB, …). See docs/guide/production-deployment.md §4-§5.

services:
  gateway-a:
    build:
      context: ../../..
      dockerfile: examples/compose/gateway-ha/Dockerfile
    image: meshy-dcc-server:latest
    container_name: meshy-dcc-gateway-a
    environment:
      MESHY_DCC_SERVER_NAME: gateway-a
      MESHY_DCC_DCC: generic
      MESHY_DCC_GATEWAY_PORT: "19765"
      MESHY_DCC_HEARTBEAT_INTERVAL: "2"
      MESHY_DCC_STALE_TIMEOUT: "10"
    volumes:
      - registry:/var/lib/meshy-dcc
    ports:
      - "19765:19765"
    restart: unless-stopped

  gateway-b:
    image: meshy-dcc-server:latest
    container_name: meshy-dcc-gateway-b
    depends_on:
      - gateway-a
    environment:
      MESHY_DCC_SERVER_NAME: gateway-b
      MESHY_DCC_DCC: generic
      MESHY_DCC_GATEWAY_PORT: "19765"
      MESHY_DCC_HEARTBEAT_INTERVAL: "2"
      MESHY_DCC_STALE_TIMEOUT: "10"
    volumes:
      - registry:/var/lib/meshy-dcc
    restart: unless-stopped

  dcc-maya-1:
    image: meshy-dcc-server:latest
    container_name: meshy-dcc-maya-1
    depends_on:
      - gateway-a
    environment:
      MESHY_DCC_SERVER_NAME: maya-1
      MESHY_DCC_DCC: maya
      MESHY_DCC_DCC_VERSION: "2025"
      MESHY_DCC_SCENE: shot_001.ma
      # Plain instance — do not compete for the gateway port.
      MESHY_DCC_GATEWAY_PORT: "0"
    volumes:
      - registry:/var/lib/meshy-dcc
    restart: unless-stopped

  dcc-blender-1:
    image: meshy-dcc-server:latest
    container_name: meshy-dcc-blender-1
    depends_on:
      - gateway-a
    environment:
      MESHY_DCC_SERVER_NAME: blender-1
      MESHY_DCC_DCC: blender
      MESHY_DCC_DCC_VERSION: "4.2"
      MESHY_DCC_SCENE: rig.blend
      MESHY_DCC_GATEWAY_PORT: "0"
    volumes:
      - registry:/var/lib/meshy-dcc
    restart: unless-stopped

volumes:
  registry:
